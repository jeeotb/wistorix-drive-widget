<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wistorix</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="sp-head">
    <div data-logo></div>
    <div class="sp-brand"><b>Wistorix</b><span id="wxAcct">—</span></div>
    <div class="sp-status" id="wxStatus"><i></i><span>Dữ liệu mẫu</span></div>
    <button class="sp-x" data-act="close" aria-label="Đóng" data-ic="x"></button>
  </header>
  <nav class="sp-tabs" role="tablist" aria-label="Chức năng" id="wxTabs">
    <button class="sp-tab" role="tab" data-act="tab" data-tab="tep" aria-selected="true"><span data-ic="file"></span>Tệp</button>
    <button class="sp-tab" role="tab" data-act="tab" data-tab="baomat" aria-selected="false"><span data-ic="shield"></span>Bảo mật<span class="sp-badge" id="wxBadge" hidden></span></button>
    <button class="sp-tab" role="tab" data-act="tab" data-tab="hieuqua" aria-selected="false"><span data-ic="chart"></span>Hiệu quả</button>
  </nav>
  <main class="sp-body" id="wxBody" role="tabpanel"></main>
  <footer class="sp-foot"><div class="grow" id="wxFootNote"></div><button data-act="dashboard"><span data-ic="external"></span> Dashboard</button></footer>
  <div id="wxToast" role="status"></div>
  <script src="shared.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
